<text x="20.0" y="328.0" fill="#898781" font-size="11.5" font-weight="normal" text-anchor="start" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">Not shown: the single worst sample (up to 144 µs) is the OS interrupting the thread; macOS cannot pin threads.</text>
